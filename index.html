<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gabung Data Kendaraan</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #000; color: #fff; max-width: 95%; margin: 20px auto; padding: 0 10px; }
    h1 { text-align: center; color: #ff2233; font-size: 20px; }
    
    .upload-box {
      border: 2px dashed #ff2233;
      border-radius: 10px;
      padding: 30px 15px;
      text-align: center;
      margin-bottom: 20px;
    }
    input[type="file"] { display: none; }
    
    .btn {
      background: #ff2233;
      color: white;
      border: none;
      padding: 12px 22px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin: 5px;
    }
    .btn:disabled { background: #444; cursor: not-allowed; }
    .btn-success { background: #34d399; color: #000; }
    
    .file-info {
      background: #1a1a1a;
      padding: 12px;
      border-radius: 6px;
      margin: 10px 0;
      display: none;
    }
    
    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 12px; }
    th, td { border: 1px solid #333; padding: 6px 8px; text-align: left; }
    th { background: #ff2233; }
    
    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #1a1a1a;
      border: 2px solid #34d399;
      border-radius: 10px;
      padding: 25px;
      z-index: 999;
      display: none;
      text-align: center;
      max-width: 300px;
    }
    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
    }
    .status { margin-top: 15px; color: #34d399; display: none; }
  </style>
</head>
<body>

<h1>🚛 Gabung Data Kendaraan</h1>

<div class="upload-box">
  <p style="font-size: 16px; margin-bottom: 10px;">📂 Pilih File .xlsx</p>
  <p style="font-size: 13px; color: #888; margin-bottom: 15px;">Bisa pilih lebih dari satu file sekaligus</p>
  <button class="btn" onclick="document.getElementById('fileInput').click()">Pilih File</button>
  <input type="file" id="fileInput" accept=".xlsx,.xls" multiple>
  
  <div class="file-info" id="fileInfo">
    <strong>File Dipilih:</strong>
    <div id="fileListName"></div>
    <button class="btn" style="background:#444; padding:6px 12px; font-size:13px; margin-top:8px;" onclick="resetFile()">Ganti File</button>
  </div>
</div>

<div style="text-align: center; margin: 15px 0;">
  <button class="btn" id="mergeBtn" onclick="prosesGabung()" disabled>🔄 Gabungkan Sekarang</button>
  <button class="btn btn-success" id="downloadBtn" onclick="downloadFile()" disabled>💾 Download Hasil</button>
  <button class="btn" onclick="hapusSemua()">🗑️ Bersihkan</button>
</div>

<div class="status" id="status"></div>

<div id="tableContainer" style="display:none; overflow-x:auto;">
  <h3 style="color:#34d399; margin-top:30px;">📋 Data Gabungan</h3>
  <table id="dataTable"></table>
</div>

<!-- Popup -->
<div class="overlay" id="overlay" onclick="tutupPopup()"></div>
<div class="popup" id="popup">
  <h3 style="color:#34d399; margin-top:0;">✅ Berhasil!</h3>
  <p id="popupText"></p>
  <button class="btn" onclick="tutupPopup()">Mengerti</button>
</div>

<script>
let semuaData = [];
let fileTerpilih = [];
const fileInput = document.getElementById('fileInput');

// Cek library sudah siap
window.onload = function() {
  if (typeof XLSX === 'undefined') {
    tampilkanStatus('⏳ Sedang memuat... Tunggu sebentar lalu pilih file lagi', '#fbbf24');
  }
};

fileInput.addEventListener('change', function(e) {
  fileTerpilih = e.target.files;
  
  if (fileTerpilih.length === 0) return;
  
  // Tampilkan nama file yang dipilih
  document.getElementById('fileInfo').style.display = 'block';
  document.getElementById('fileListName').innerHTML = Array.from(fileTerpilih).map(f => 
    `<div>📄 ${f.name}</div>`
  ).join('');
  
  document.getElementById('mergeBtn').disabled = false;
  tampilkanStatus(`${fileTerpilih.length} file siap diproses ✅`, '#34d399');
});

function resetFile() {
  fileInput.value = '';
  fileTerpilih = [];
  document.getElementById('fileInfo').style.display = 'none';
  document.getElementById('mergeBtn').disabled = true;
  document.getElementById('status').style.display = 'none';
}

async function prosesGabung() {
  if (fileTerpilih.length === 0) return;
  if (typeof XLSX === 'undefined') {
    tampilkanPopup('Tunggu internet sebentar, lalu buka ulang halaman ini');
    return;
  }
  
  tampilkanStatus('⏳ Sedang memproses...', '#22d3ee');
  semuaData = [];
  
  for (let i = 0; i < fileTerpilih.length; i++) {
    const file = fileTerpilih[i];
    
    try {
      const data = await bacaFile(file);
      const workbook = XLSX.read(data, { type: 'array' });
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet);
      
      if (json.length === 0) continue;
      
      json.forEach(baris => {
        semuaData.push(normalisasiKolom(baris));
      });
      
    } catch (err) {
      console.error('Error:', err);
    }
  }
  
  simpanKeLocal();
  tampilkanTabel();
  document.getElementById('downloadBtn').disabled = false;
  
  tampilkanPopup(`Berhasil!\n${fileTerpilih.length} file digabung\n${semuaData.length} baris data`);
  
  // Reset daftar file saja, data tetap ada
  resetFile();
}

// Samakan nama kolom
function normalisasiKolom(obj) {
  const peta = {
    'nopol': ['nopol', 'no polisi', 'plat nomor', 'plat', 'no plat'],
    'nama_pemilik': ['nama pemilik', 'nama', 'pemilik', 'costumer name'],
    'nik': ['nik', 'no ktp', 'nomor ktp'],
    'nomor_rangka': ['nomor rangka', 'noka', 'no rangka'],
    'nomor_mesin': ['nomor mesin', 'nosin', 'no mesin'],
    'warna': ['warna'],
    'tahun': ['tahun', 'tahun kendaraan'],
    'bbm': ['bbm', 'jenis bbm', 'bahan bakar'],
    'alamat': ['alamat'],
    'no_bpkb': ['no bpkb', 'nomor bpkb', 'bpkb'],
    'no_stnk': ['no stnk', 'nomor stnk', 'stnk'],
    'merek': ['merek', 'merk'],
    'tipe': ['tipe', 'type', 'seri']
  };
  
  const hasil = {};
  
  for (let kunci of Object.keys(obj)) {
    const nilai = obj[kunci];
    const kunciBersih = kunci.toString().trim().toLowerCase();
    
    let ditemukan = false;
    for (let namaStandar of Object.keys(peta)) {
      if (peta[namaStandar].some(alias => kunciBersih.includes(alias))) {
        hasil[namaStandar] = nilai;
        ditemukan = true;
        break;
      }
    }
    if (!ditemukan) {
      hasil[kunciBersih] = nilai;
    }
  }
  return hasil;
}

function tampilkanTabel() {
  if (semuaData.length === 0) return;
  
  document.getElementById('tableContainer').style.display = 'block';
  const tabel = document.getElementById('dataTable');
  
  // Ambil semua nama kolom
  const semuaKunci = [];
  semuaData.forEach(row => {
    Object.keys(row).forEach(k => {
      if (!semuaKunci.includes(k)) semuaKunci.push(k);
    });
  });
  
  // Urutan yang diinginkan
  const urutanPrioritas = ['nopol', 'nama_pemilik', 'nik', 'nomor_rangka', 'nomor_mesin', 'warna', 'tahun', 'bbm', 'alamat', 'no_bpkb', 'no_stnk', 'merek', 'tipe'];
  const urutan = [...urutanPrioritas, ...semuaKunci.filter(k => !urutanPrioritas.includes(k))];
  
  // Header
  let html = '<thead><tr>';
  urutan.forEach(k => html += `<th>${k.replace('_', ' ').toUpperCase()}</th>`);
  html += '</tr></thead><tbody>';
  
  // Isi data
  semuaData.forEach(row => {
    html += '<tr>';
    urutan.forEach(k => html += `<td>${row[k] || ''}</td>`);
    html += '</tr>';
  });
  
  html += '</tbody>';
  tabel.innerHTML = html;
}

function simpanKeLocal() {
  localStorage.setItem('dataGabungan', JSON.stringify(semuaData));
}

// Muat data tersimpan
window.onload = function() {
  const simpanan = localStorage.getItem('dataGabungan');
  if (simpanan) {
    semuaData = JSON.parse(simpanan);
    tampilkanTabel();
    document.getElementById('downloadBtn').disabled = semuaData.length === 0;
  }
  if (typeof XLSX === 'undefined') {
    tampilkanStatus('⚠️ Pastikan internet aktif saat pertama kali dibuka', '#fbbf24');
  }
};

function downloadFile() {
  if (semuaData.length === 0) return;
  
  if (typeof XLSX === 'undefined') {
    tampilkanPopup('Tunggu internet sebentar lalu coba lagi');
    return;
  }
  
  const ws = XLSX.utils.json_to_sheet(semuaData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Data Gabungan');
  
  const namaFile = `Data_Kendaraan_${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, namaFile);
  
  tampilkanPopup(`File terunduh:\n${namaFile}`);
}

function hapusSemua() {
  if (confirm('Yakin hapus semua data?')) {
    semuaData = [];
    localStorage.removeItem('dataGabungan');
    document.getElementById('tableContainer').style.display = 'none';
    document.getElementById('downloadBtn').disabled = true;
    document.getElementById('status').style.display = 'none';
  }
}

function bacaFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

function tampilkanStatus(teks, warna) {
  const el = document.getElementById('status');
  el.textContent = teks;
  el.style.color = warna;
  el.style.display = 'block';
}

function tampilkanPopup(teks) {
  document.getElementById('popupText').innerText = teks;
  document.getElementById('overlay').style.display = 'block';
  document.getElementById('popup').style.display = 'block';
}

function tutupPopup() {
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('popup').style.display = 'none';
}
</script>

</body>
</html>
